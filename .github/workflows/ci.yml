name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dev tooling
        run: uv sync --frozen --only-dev

      - name: Ruff check (lint)
        run: uv run ruff check .

      - name: Ruff format (check only)
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        # Unit tests are pure-function tests (no S3/Postgres/network access),
        # so no real credentials are needed here -- DATABASE_URL/BUCKET_ID only
        # have to be *set* because src/core/config.py (Settings) fails fast at
        # import time if a required field is missing, not because anything
        # actually connects to Postgres or S3.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BUCKET_ID: ci-test-bucket
        run: uv run pytest tests/unit -v
